<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Identity</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,107,53,0.08) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    animation: pulse 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  }

  .container {
    text-align: center;
    padding: 2rem;
    max-width: 480px;
    width: 100%;
  }

  .lock-icon {
    width: 56px; height: 56px;
    border: 2px solid #333;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 2rem;
  }

  .lock-icon svg {
    width: 24px; height: 24px;
    fill: none;
    stroke: #ff6b35;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    font-size: clamp(1.3rem, 4.5vw, 1.8rem);
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 0.6rem;
    letter-spacing: -0.02em;
  }

  h1 span {
    color: #ff6b35;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #777;
    font-weight: 300;
    margin-bottom: 2.5rem;
    line-height: 1.5;
  }

  .login-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.95rem 1.5rem;
    border: 1.5px solid #2a2a2a;
    border-radius: 14px;
    background: #111;
    color: #f0f0f0;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
  }

  .login-btn:hover {
    border-color: #ea4335;
    background: #1a1a1a;
    transform: translateY(-1px);
  }

  .login-btn:active {
    transform: scale(0.98);
  }

  .login-btn:focus-visible {
    outline: 2px solid #ff6b35;
    outline-offset: 2px;
  }

  .login-btn svg {
    width: 22px; height: 22px;
    flex-shrink: 0;
  }

  .note {
    margin-top: 2rem;
    font-size: 0.78rem;
    color: #444;
    font-weight: 300;
    line-height: 1.5;
  }
</style>
</head>
<body>

<main class="container">
  <div class="lock-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>

  <h1>To prove you're really <span>you</span></h1>
  <p class="subtitle">Confirm your identity with your Google account to continue.</p>

  <a href="google.html" class="login-btn" role="button">
    <svg viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Continue with Google
  </a>

  <p class="note">We won't post anything on your behalf. This is only used for verification.</p>
</main>

</body>
</html>
