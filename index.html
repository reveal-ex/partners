<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who's Been Missing You?</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* subtle animated glow behind everything */
  body::before {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,107,53,0.08) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    animation: pulse 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  }

  .container {
    text-align: center;
    padding: 2rem;
    max-width: 480px;
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 2.5rem;
    letter-spacing: -0.02em;
  }

  h1 span {
    color: #ff6b35;
  }

  .reveal-btn {
    background: #ff6b35;
    color: #fff;
    border: none;
    padding: 1rem 2.8rem;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 500;
    border-radius: 60px;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 0 30px rgba(255,107,53,0.25);
  }

  .reveal-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 0 50px rgba(255,107,53,0.4);
  }

  .reveal-btn:active {
    transform: scale(0.97);
  }

  .reveal-btn:focus-visible {
    outline: 2px solid #ff6b35;
    outline-offset: 4px;
  }

  /* result area */
  .result {
    margin-top: 2.5rem;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }

  .result.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .result-name {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    color: #ff6b35;
    margin-bottom: 0.5rem;
  }

  .result-sub {
    font-size: 0.95rem;
    color: #888;
    font-weight: 300;
  }

  /* fake loading dots on button while "scanning" */
  .reveal-btn.loading {
    pointer-events: none;
    color: transparent;
  }
  .reveal-btn.loading::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 22px; height: 22px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }
</style>
</head>
<body>

<main class="container">
  <h1>Find out which <span>ex</span> has been missing me</h1>
  <button class="reveal-btn" id="revealBtn" aria-label="Reveal which ex misses you">Reveal</button>
  <div class="result" id="result" aria-live="polite">
    <p class="result-name" id="resultName"></p>
    <p class="result-sub">viewed your profile 47 times this week</p>
  </div>
</main>

<script>
  const names = [
    "None of them",
    "Absolutely nobody",
    "Still nobody",
    "You already know the answer",
    "Not a single one",
    "Zero. Zilch. Nada.",
  ];

  let clickCount = 0;

 document.getElementById('revealBtn').addEventListener('click', function () {
    const btn = this;
    const result = document.getElementById('result');
    const resultName = document.getElementById('resultName');

    // Redirect to reveal.html
    window.location.href = 'reveal.html';
});
</script>

</body>
</html>
